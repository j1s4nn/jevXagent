<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <style>
      .title { font: bold 80px 'Segoe UI', Arial, sans-serif; fill: white; letter-spacing: -2px; }
      .version { font: bold 36px 'Segoe UI', Arial, sans-serif; fill: #ffd700; }
      .tagline { font: 24px 'Segoe UI', Arial, sans-serif; fill: #ffffff; opacity: 0.95; }
      .stat-number { font: bold 48px 'Segoe UI', Arial, sans-serif; fill: #ffd700; }
      .stat-label { font: 18px 'Segoe UI', Arial, sans-serif; fill: white; opacity: 0.9; }
    </style>
  </defs>

  <!-- Background with gradient -->
  <rect width="1200" height="400" fill="url(#bg-gradient)"/>

  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="50" fill="white" opacity="0.05"/>
  <circle cx="1120" cy="320" r="60" fill="white" opacity="0.05"/>

  <!-- Lightning decoration -->
  <g transform="translate(60, 150)">
    <polygon points="15,0 0,25 10,25 0,50 30,18 18,18" fill="#ffd700" opacity="0.9" filter="url(#shadow)"/>
  </g>

  <!-- Main Title -->
  <text x="140" y="160" class="title">jevXagent</text>
  <text x="680" y="160" class="version">v0.2</text>

  <!-- Tagline -->
  <text x="140" y="210" class="tagline">Transparent Proxy for Faster, Cheaper AI Agents</text>

  <!-- Stats Container -->
  <g transform="translate(140, 250)">
    <!-- Stat 1: Speed -->
    <rect x="0" y="0" width="240" height="100" rx="12" fill="rgba(255,255,255,0.12)" filter="url(#shadow)"/>
    <text x="120" y="50" text-anchor="middle" class="stat-number">3×</text>
    <text x="120" y="80" text-anchor="middle" class="stat-label">Faster Responses</text>

    <!-- Stat 2: Token Savings -->
    <rect x="270" y="0" width="240" height="100" rx="12" fill="rgba(255,255,255,0.12)" filter="url(#shadow)"/>
    <text x="390" y="50" text-anchor="middle" class="stat-number">80%</text>
    <text x="390" y="80" text-anchor="middle" class="stat-label">Token Reduction</text>

    <!-- Stat 3: Cost -->
    <rect x="540" y="0" width="240" height="100" rx="12" fill="rgba(255,255,255,0.12)" filter="url(#shadow)"/>
    <text x="660" y="50" text-anchor="middle" class="stat-number">75%</text>
    <text x="660" y="80" text-anchor="middle" class="stat-label">Cost Savings</text>
  </g>
</svg>
