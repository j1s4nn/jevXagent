<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <style>
      .title { font: bold 22px 'Segoe UI', Arial, sans-serif; fill: #1a1a1a; }
      .subtitle { font: 16px 'Segoe UI', Arial, sans-serif; fill: #666; }
      .label { font: 14px 'Segoe UI', Arial, sans-serif; fill: #333; }
      .label-small { font: 12px 'Segoe UI', Arial, sans-serif; fill: #555; font-style: italic; }
      .metric-bad { font: bold 16px 'Segoe UI', Arial, sans-serif; fill: #dc3545; }
      .metric-good { font: bold 16px 'Segoe UI', Arial, sans-serif; fill: #28a745; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; }
      .slow-box { fill: #fff5f5; stroke: #fc8181; stroke-width: 2.5; }
      .fast-box { fill: #f0fff4; stroke: #68d391; stroke-width: 2.5; }
      .process-box { fill: white; stroke: #cbd5e0; stroke-width: 2; }
    </style>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#fc8181"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#68d391"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="600" y="35" text-anchor="middle" class="title">Performance Comparison</text>
  <text x="600" y="60" text-anchor="middle" class="subtitle">Same Request - Different Architectures</text>

  <!-- Divider -->
  <line x1="600" y1="90" x2="600" y2="480" stroke="#e2e8f0" stroke-width="3"/>

  <!-- LEFT: Without jevXagent -->
  <text x="300" y="110" text-anchor="middle" class="title" fill="#dc3545">Without jevXagent</text>
  <text x="300" y="135" text-anchor="middle" class="metric-bad">2,400ms • 240 tokens</text>

  <!-- User Input -->
  <rect x="200" y="160" width="200" height="50" class="box" rx="8"/>
  <text x="300" y="190" text-anchor="middle" class="label">User: "restart the pod"</text>

  <path d="M 300 210 L 300 240" stroke="#fc8181" stroke-width="3" marker-end="url(#arrow-red)"/>

  <!-- Agent Processing (Slow) -->
  <rect x="150" y="240" width="300" height="180" class="slow-box" rx="8"/>
  <text x="300" y="265" text-anchor="middle" class="label" font-weight="bold">Agent LLM (All Processing)</text>
  <text x="300" y="295" text-anchor="middle" class="label-small">1. Classify request type</text>
  <text x="300" y="315" text-anchor="middle" class="label-small">2. Determine context</text>
  <text x="300" y="335" text-anchor="middle" class="label-small">3. Plan response</text>
  <text x="300" y="355" text-anchor="middle" class="label-small">4. Generate explanation</text>
  <text x="300" y="375" text-anchor="middle" class="label-small">5. Write code</text>
  <text x="300" y="400" text-anchor="middle" class="metric-bad">⏱ 2,400ms</text>

  <path d="M 300 420 L 300 450" stroke="#fc8181" stroke-width="3" marker-end="url(#arrow-red)"/>

  <!-- Result (Slow) -->
  <rect x="180" y="450" width="240" height="30" class="slow-box" rx="6"/>
  <text x="300" y="470" text-anchor="middle" class="label">Long response + explanation</text>

  <!-- RIGHT: With jevXagent -->
  <text x="900" y="110" text-anchor="middle" class="title" fill="#28a745">With jevXagent</text>
  <text x="900" y="135" text-anchor="middle" class="metric-good">890ms • 48 tokens</text>

  <!-- User Input -->
  <rect x="800" y="160" width="200" height="50" class="box" rx="8"/>
  <text x="900" y="190" text-anchor="middle" class="label">User: "restart the pod"</text>

  <path d="M 900 210 L 900 240" stroke="#68d391" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- Jev Fast Decision -->
  <rect x="760" y="240" width="280" height="70" class="fast-box" rx="8"/>
  <text x="900" y="265" text-anchor="middle" class="label" font-weight="bold">Jev Decision Engine</text>
  <text x="900" y="290" text-anchor="middle" class="label-small">DevOps • kubectl • urgent</text>
  <text x="900" y="305" text-anchor="middle" class="metric-good">⚡ 120ms</text>

  <!-- Line J Arrow -->
  <path d="M 900 310 L 900 340" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrow-yellow)"/>
  <rect x="850" y="320" width="100" height="28" fill="#f59e0b" rx="6"/>
  <text x="900" y="339" text-anchor="middle" style="font: bold 14px 'Segoe UI'; fill: white;">Line J</text>

  <!-- Agent Generation (Fast) -->
  <rect x="760" y="340" width="280" height="80" class="fast-box" rx="8"/>
  <text x="900" y="365" text-anchor="middle" class="label" font-weight="bold">Agent LLM (Generation Only)</text>
  <text x="900" y="390" text-anchor="middle" class="label-small">Context already provided</text>
  <text x="900" y="410" text-anchor="middle" class="metric-good">⚡ 770ms</text>

  <path d="M 900 420 L 900 450" stroke="#68d391" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- Result (Fast) -->
  <rect x="810" y="450" width="180" height="30" class="fast-box" rx="6"/>
  <text x="900" y="470" text-anchor="middle" class="label">Concise code only</text>
</svg>
